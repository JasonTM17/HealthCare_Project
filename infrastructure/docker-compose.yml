services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-healthcare}
      POSTGRES_USER:     ${POSTGRES_USER:-healthcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: healthcare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── MinIO (S3-compatible object store) ──────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: healthcare-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-healthcare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    restart: unless-stopped
    environment:
      BACKEND_PORT:       8080
      DATABASE_URL:       jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthcare}
      DATABASE_USERNAME:  ${POSTGRES_USER:-healthcare}
      DATABASE_PASSWORD:  ${POSTGRES_PASSWORD:-change-me}
      JWT_SECRET:         ${JWT_SECRET:-local-jwt-secret-not-for-production}
      JWT_ACCESS_TTL:     ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL:    ${JWT_REFRESH_TTL:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AI_SERVICE_URL:     http://healthcare-ai-service:8000
      AI_SERVICE_RUNTIME: compose
      AI_SERVICE_ALLOW_UNAUTHENTICATED_LOCAL: "false"
      AI_SERVICE_TOKEN:   ${AI_SERVICE_TOKEN:-local-development-token-not-for-production}
      AI_RAG_INGEST_ENABLED: ${RAG_INGEST_ENABLED:-false}
      AI_RAG_INGEST_TOKEN:   ${RAG_INGEST_TOKEN:-}
      # Local Compose has no SMS provider, so the demo flow accepts 123456.
      # Set APP_BOOKING_ALLOW_TEST_OTP=false when a real OTP provider is wired.
      APP_BOOKING_ALLOW_TEST_OTP: ${APP_BOOKING_ALLOW_TEST_OTP:-true}
      CMS_DISTRIBUTED_REALTIME_ENABLED: "true"
      REDIS_HOST:         redis
      REDIS_PORT:         "6379"
      SPRING_FLYWAY_OUT_OF_ORDER: ${SPRING_FLYWAY_OUT_OF_ORDER:-false}
      MINIO_ENDPOINT:      http://minio:9000
      MINIO_ACCESS_KEY:    ${MINIO_ROOT_USER:-healthcare}
      MINIO_SECRET_KEY:    ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── One-shot PostgreSQL seed ────────────────────────────────────────────────
  # The seed is mounted only here and runs after backend health, which means
  # Flyway has completed before any local rows are inserted. Override SEED_FILE
  # for the larger fictional dataset; never replace the Flyway migrations.
  local-seed:
    image: postgres:16-alpine
    container_name: healthcare-local-seed
    restart: "no"
    environment:
      PGHOST:     postgres
      PGPORT:     "5432"
      PGDATABASE: ${POSTGRES_DB:-healthcare}
      PGUSER:     ${POSTGRES_USER:-healthcare}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ${SEED_FILE:-../apps/backend/src/main/resources/db/seed/seed-local-data.sql}:/seed/seed.sql:ro
      - ../apps/backend/src/main/resources/db/seed/seed-local-careers.sql:/seed/careers.sql:ro
      - ../apps/backend/src/main/resources/db/seed/seed-local-rich-content.sql:/seed/rich-content.sql:ro
    depends_on:
      backend:
        condition: service_healthy
    command: ["/bin/sh", "-ec", "psql -v ON_ERROR_STOP=1 -f /seed/seed.sql -f /seed/careers.sql -f /seed/rich-content.sql"]

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: healthcare-frontend
    restart: unless-stopped
    environment:
      # Keep browser traffic same-origin. Next forwards this path over the
      # Compose network, so the browser never needs to resolve a container or
      # host-local backend address.
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ── FastAPI AI Service ──────────────────────────────────────────────────────
  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    container_name: healthcare-ai-service
    restart: unless-stopped
    environment:
      AI_PROVIDER: rule_based_triage
      EMBEDDING_PROVIDER: local
      RAG_INGEST_ENABLED: ${RAG_INGEST_ENABLED:-false}
      RAG_INGEST_TOKEN: ${RAG_INGEST_TOKEN:-}
      RAG_MAX_DOCUMENTS: ${RAG_MAX_DOCUMENTS:-5000}
      AI_SERVICE_RUNTIME: compose
      AI_SERVICE_ALLOW_UNAUTHENTICATED_LOCAL: "false"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-development-token-not-for-production}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; request = urllib.request.Request('http://localhost:8000/health', headers={'X-AI-Service-Token': os.environ['AI_SERVICE_TOKEN']}); urllib.request.urlopen(request, timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  minio-data:
