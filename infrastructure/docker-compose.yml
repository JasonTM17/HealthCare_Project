services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-healthcare}
      POSTGRES_USER:     ${POSTGRES_USER:-healthcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    networks: [default, edge]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks: [default, edge]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Mailpit local SMTP sink ────────────────────────────────────────────────
  # Captures local auth mail only; never use this service as production SMTP.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    networks: [default, edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── MinIO (S3-compatible object store) ──────────────────────────────────────
  # Disposable local-only defaults. Never reuse these credentials or expose
  # this service outside loopback; hosted storage is provisioned separately.
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-healthcare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      MINIO_API_CORS_ALLOW_ORIGIN: ${BFF_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    networks: [default, edge]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Only this disposable local profile provisions the private bucket. Hosted
  # buckets are provisioned separately with least-privilege service credentials.
  minio-init:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-healthcare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-healthcare-files}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1
        mc mb --ignore-existing "local/$${STORAGE_BUCKET}" >/dev/null 2>&1
        mc anonymous set none "local/$${STORAGE_BUCKET}" >/dev/null 2>&1

  # ── Private ClamAV attachment scanner ──────────────────────────────────────
  # clamd is never published to the host. The HTTP adapter below is also
  # private and requires the same process-injected token used by Spring.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped

  attachment-scanner:
    build:
      context: ./av-scanner
      dockerfile: Dockerfile
      args:
        VCS_REF: ${BUILD_VCS_REF:-unknown}
    restart: unless-stopped
    environment:
      SCANNER_SERVICE_TOKEN: ${STORAGE_AV_SERVICE_TOKEN:?STORAGE_AV_SERVICE_TOKEN is required}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      MAX_SCAN_BYTES: "10485760"
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${BUILD_VCS_REF:-unknown}
    restart: unless-stopped
    environment:
      BACKEND_PORT:       8080
      DATABASE_URL:       jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthcare}
      DATABASE_USERNAME:  ${POSTGRES_USER:-healthcare}
      DATABASE_PASSWORD:  ${POSTGRES_PASSWORD:-change-me}
      JWT_SECRET:         ${JWT_SECRET:-local-jwt-secret-not-for-production}
      JWT_ACCESS_TTL:     ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL:    ${JWT_REFRESH_TTL:-604800}
      # Server-to-server trust only. Compose refuses to start without an
      # operator-provided value shared with the Next.js BFF.
      BACKEND_BFF_SERVICE_TOKEN: ${BACKEND_BFF_SERVICE_TOKEN:?BACKEND_BFF_SERVICE_TOKEN is required}
      BACKEND_BFF_REQUIRED: "true"
      BFF_ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # The public Spring service is not a browser API. Non-browser clients do
      # not send Origin and remain unaffected.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_SECURITY_RATE_LIMIT_ENABLED: ${APP_SECURITY_RATE_LIMIT_ENABLED:-true}
      APP_SECURITY_RATE_LIMIT_WINDOW_SECONDS: ${APP_SECURITY_RATE_LIMIT_WINDOW_SECONDS:-60}
      APP_SECURITY_RATE_LIMIT_AUTH_LIMIT: ${APP_SECURITY_RATE_LIMIT_AUTH_LIMIT:-20}
      APP_SECURITY_RATE_LIMIT_APPOINTMENT_LIMIT: ${APP_SECURITY_RATE_LIMIT_APPOINTMENT_LIMIT:-60}
      APP_SECURITY_RATE_LIMIT_AI_LIMIT: ${APP_SECURITY_RATE_LIMIT_AI_LIMIT:-30}
      APP_SECURITY_RATE_LIMIT_PAYMENT_LIMIT: ${APP_SECURITY_RATE_LIMIT_PAYMENT_LIMIT:-20}
      APP_SECURITY_RATE_LIMIT_WEBHOOK_LIMIT: ${APP_SECURITY_RATE_LIMIT_WEBHOOK_LIMIT:-120}
      # Redis-backed per-email/IP auth limits remain enabled. Overrides are
      # reserved for repeated diagnostics in this disposable local stack; the
      # committed defaults stay aligned with the application security policy.
      APP_AUTH_OTP_WINDOW_SECONDS: ${APP_AUTH_OTP_WINDOW_SECONDS:-900}
      APP_AUTH_OTP_IP_LIMIT: ${APP_AUTH_OTP_IP_LIMIT:-20}
      APP_AUTH_OTP_EMAIL_LIMIT: ${APP_AUTH_OTP_EMAIL_LIMIT:-5}
      AI_SERVICE_URL:     http://ai-service:8000
      AI_SERVICE_RUNTIME: compose
      AI_SERVICE_ALLOW_UNAUTHENTICATED_LOCAL: "false"
      AI_SERVICE_TOKEN:   ${AI_SERVICE_TOKEN:-local-development-token-not-for-production}
      # Protected local catalog reconciliation is enabled for the disposable
      # Compose profile; replace both placeholder tokens before any shared run.
      AI_RAG_INGEST_ENABLED: ${RAG_INGEST_ENABLED:-true}
      AI_RAG_INGEST_TOKEN:   ${RAG_INGEST_TOKEN:-local-rag-ingest-token-not-for-production}
      AI_CHAT_RETENTION_DAYS: ${AI_CHAT_RETENTION_DAYS:-90}
      AI_CHAT_CLEANUP_ENABLED: ${AI_CHAT_CLEANUP_ENABLED:-true}
      AI_CHAT_CLEANUP_CRON: ${AI_CHAT_CLEANUP_CRON:-0 20 3 * * *}
      AI_CHAT_CLEANUP_BATCH_SIZE: ${AI_CHAT_CLEANUP_BATCH_SIZE:-200}
      AI_CHAT_CLEANUP_MAX_BATCHES: ${AI_CHAT_CLEANUP_MAX_BATCHES:-20}
      AI_CHAT_PROCESSING_LEASE_SECONDS: ${AI_CHAT_PROCESSING_LEASE_SECONDS:-120}
      # Local Compose enables clinical modes only after the local synthetic
      # approval/reconciliation gate; production should override both false.
      AI_CHAT_SYMPTOM_TRIAGE_ENABLED: ${AI_CHAT_SYMPTOM_TRIAGE_ENABLED:-false}
      AI_CHAT_HEALTH_EDUCATION_ENABLED: ${AI_CHAT_HEALTH_EDUCATION_ENABLED:-false}
      # Spring provenance gate stays closed even if an AI provider key exists.
      AI_CHAT_REMOTE_PROVIDER_ENABLED: ${AI_CHAT_REMOTE_PROVIDER_ENABLED:-false}
      AI_CHAT_SYNTHETIC_BETA_ASSERTED: ${AI_CHAT_SYNTHETIC_BETA_ASSERTED:-false}
      APP_MAIL_ENABLED:      ${APP_MAIL_ENABLED:-true}
      APP_MAIL_FROM:         ${APP_MAIL_FROM:-no-reply@healthcare.local}
      APP_MAIL_PORTAL_BASE_URL: ${APP_MAIL_PORTAL_BASE_URL:-}
      APP_MAIL_OUTBOX_ENABLED: "true"
      APP_MAIL_OUTBOX_ENCRYPTION_KEY: ${APP_MAIL_OUTBOX_ENCRYPTION_KEY:?APP_MAIL_OUTBOX_ENCRYPTION_KEY is required}
      APP_MAIL_OUTBOX_POLL_MS: ${APP_MAIL_OUTBOX_POLL_MS:-1000}
      APP_MAIL_OUTBOX_RETENTION_DAYS: "90"
      APP_MAIL_OUTBOX_CLEANUP_MS: "3600000"
      APP_MAIL_OUTBOX_CLEANUP_INITIAL_DELAY_MS: "3600000"
      # Compose always routes SMTP through the private Mailpit service.  The
      # root .env.example also supports a bare-host process, where localhost is
      # correct, but that value must never leak into this container network.
      SPRING_MAIL_HOST:      mailpit
      SPRING_MAIL_PORT:      "1025"
      SPRING_MAIL_USERNAME:  ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD:  ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-false}
      SPRING_MAIL_STARTTLS_REQUIRED: ${SPRING_MAIL_STARTTLS_REQUIRED:-false}
      SPRING_MAIL_CONNECTION_TIMEOUT: ${SPRING_MAIL_CONNECTION_TIMEOUT:-5000}
      SPRING_MAIL_TIMEOUT:   ${SPRING_MAIL_TIMEOUT:-5000}
      SPRING_MAIL_WRITE_TIMEOUT: ${SPRING_MAIL_WRITE_TIMEOUT:-5000}
      # Fixed OTPs are restricted to the Spring test profile and stay disabled in Compose.
      APP_BOOKING_ALLOW_TEST_OTP: ${APP_BOOKING_ALLOW_TEST_OTP:-false}
      APP_PAYMENT_BANK_TRANSFER_ENABLED: ${APP_PAYMENT_BANK_TRANSFER_ENABLED:-true}
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:-Vietcombank LOCAL DEMO}
      PAYMENT_BANK_BIN: ${PAYMENT_BANK_BIN:-970436}
      PAYMENT_BANK_ACCOUNT: ${PAYMENT_BANK_ACCOUNT:-0123456789}
      PAYMENT_BANK_ACCOUNT_HOLDER: ${PAYMENT_BANK_ACCOUNT_HOLDER:-HEALTHCARE DEMO}
      PAYMENT_DEFAULT_AMOUNT: ${PAYMENT_DEFAULT_AMOUNT:-200000}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}
      PAYMENT_STATUS_EMAIL_ENABLED: ${PAYMENT_STATUS_EMAIL_ENABLED:-true}
      CMS_DISTRIBUTED_REALTIME_ENABLED: "true"
      REDIS_URL:          redis://redis:6379
      REDIS_HOST:         redis
      REDIS_PORT:         "6379"
      SPRING_FLYWAY_OUT_OF_ORDER: ${SPRING_FLYWAY_OUT_OF_ORDER:-false}
      MINIO_ENDPOINT:      http://minio:9000
      MINIO_ACCESS_KEY:    ${MINIO_ROOT_USER:-healthcare}
      MINIO_SECRET_KEY:    ${MINIO_ROOT_PASSWORD:-change-me}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-healthcare-files}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      # A separate loopback host prevents portal cookies reaching the object
      # store; signature Host is fixed here, never rewritten after signing.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      STORAGE_CONSULTATION_ENABLED: ${STORAGE_CONSULTATION_ENABLED:-true}
      STORAGE_CONSULTATION_SCAN_WORKER_ENABLED: "true"
      STORAGE_CONSULTATION_KEY_SIGNING_SECRET: ${STORAGE_CONSULTATION_KEY_SIGNING_SECRET:-local-compose-consultation-signing-secret-32-bytes}
      APP_PUBLIC_SPECIALTY_TRIAGE_ENABLED: "true"
      STORAGE_UPLOAD_ENABLED: "true"
      STORAGE_AV_REQUIRED: "true"
      STORAGE_AV_SERVICE_URL: http://attachment-scanner:8080/scan
      STORAGE_AV_SERVICE_TOKEN: ${STORAGE_AV_SERVICE_TOKEN:?STORAGE_AV_SERVICE_TOKEN is required}
      STORAGE_AV_ALLOWED_HOSTS: attachment-scanner
      STORAGE_MIME_VALIDATION_REQUIRED: "true"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    networks: [default, edge]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      attachment-scanner:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── One-shot PostgreSQL seed ────────────────────────────────────────────────
  # The seed is mounted only here and runs after backend health, which means
  # Flyway has completed before any local rows are inserted. Override SEED_FILE
  # for the larger fictional dataset; never replace the Flyway migrations.
  local-seed:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST:     postgres
      PGPORT:     "5432"
      PGDATABASE: ${POSTGRES_DB:-healthcare}
      PGUSER:     ${POSTGRES_USER:-healthcare}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ${SEED_FILE:-../apps/backend/src/main/resources/db/seed/seed-local-data.sql}:/seed/seed.sql:ro
      - ../apps/backend/src/main/resources/db/seed/seed-local-careers.sql:/seed/careers.sql:ro
      - ../apps/backend/src/main/resources/db/seed/seed-local-rich-content.sql:/seed/rich-content.sql:ro
    depends_on:
      backend:
        condition: service_healthy
    command: ["/bin/sh", "-ec", "psql -v ON_ERROR_STOP=1 -f /seed/seed.sql -f /seed/careers.sql -f /seed/rich-content.sql"]

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${BUILD_VCS_REF:-unknown}
    restart: unless-stopped
    environment:
      # Browser traffic stays same-origin through the runtime Route Handler.
      BACKEND_INTERNAL_URL: http://backend:8080
      BACKEND_BFF_SERVICE_TOKEN: ${BACKEND_BFF_SERVICE_TOKEN:?BACKEND_BFF_SERVICE_TOKEN is required}
      # Next.js can expose localhost:3000 internally when a different host port
      # is published, so the external browser origin is explicit and immutable.
      BFF_PUBLIC_ORIGIN: ${BFF_PUBLIC_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    networks: [default, edge]
    depends_on:
      backend:
        condition: service_healthy
      local-seed:
        condition: service_completed_successfully

  # ── FastAPI AI Service ──────────────────────────────────────────────────────
  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
      args:
        VCS_REF: ${BUILD_VCS_REF:-unknown}
    restart: unless-stopped
    environment:
      # Local Compose must be deterministic and offline by default.  A remote
      # provider is an explicit dev/staging opt-in and is never inferred from
      # an empty DeepSeek key.
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-local-deterministic}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_EMBEDDING_MODEL: ${DEEPSEEK_EMBEDDING_MODEL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      RAG_INGEST_ENABLED: ${RAG_INGEST_ENABLED:-true}
      RAG_INGEST_TOKEN: ${RAG_INGEST_TOKEN:-local-rag-ingest-token-not-for-production}
      RAG_MAX_DOCUMENTS: ${RAG_MAX_DOCUMENTS:-10000}
      RAG_STORAGE_BACKEND: ${RAG_STORAGE_BACKEND:-memory}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_DB_SCHEMA: ${SUPABASE_DB_SCHEMA:-healthcare}
      # Keep the patient-chat projection separate from the legacy catalog index.
      SUPABASE_RAG_TABLE: ${SUPABASE_RAG_TABLE:-ai_chat_documents}
      SUPABASE_RAG_RPC: ${SUPABASE_RAG_RPC:-match_chat_documents}
      SUPABASE_DB_CONNECT_TIMEOUT_SECONDS: ${SUPABASE_DB_CONNECT_TIMEOUT_SECONDS:-5}
      SUPABASE_RAG_FALLBACK_TO_MEMORY: ${SUPABASE_RAG_FALLBACK_TO_MEMORY:-false}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-384}
      AI_PATIENT_CHAT_REMOTE_ENABLED: ${AI_PATIENT_CHAT_REMOTE_ENABLED:-false}
      AI_CHAT_REMOTE_PROVIDER_ENABLED: ${AI_CHAT_REMOTE_PROVIDER_ENABLED:-false}
      REMOTE_AI_SYNTHETIC_ONLY: ${REMOTE_AI_SYNTHETIC_ONLY:-true}
      REMOTE_AI_KILL_SWITCH: ${REMOTE_AI_KILL_SWITCH:-true}
      REMOTE_AI_PROVIDER_ALLOWLIST: ${REMOTE_AI_PROVIDER_ALLOWLIST:-deepseek}
      REMOTE_AI_HTTPS_HOST_ALLOWLIST: ${REMOTE_AI_HTTPS_HOST_ALLOWLIST:-api.deepseek.com}
      AI_CHAT_CIRCUIT_FAILURE_THRESHOLD: ${AI_CHAT_CIRCUIT_FAILURE_THRESHOLD:-3}
      AI_CHAT_CIRCUIT_RESET_SECONDS: ${AI_CHAT_CIRCUIT_RESET_SECONDS:-30}
      AI_SERVICE_RUNTIME: ${AI_SERVICE_RUNTIME:-local}
      AI_SERVICE_ALLOW_UNAUTHENTICATED_LOCAL: "false"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-development-token-not-for-production}
    ports:
      - "127.0.0.1:${AI_SERVICE_HOST_PORT:-8000}:8000"
    # Keep AI on the internal-only network. Backend reaches it over Docker DNS;
    # no host port or edge network can create an outbound provider path.
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; request = urllib.request.Request('http://localhost:8000/health', headers={'X-AI-Service-Token': os.environ['AI_SERVICE_TOKEN']}); urllib.request.urlopen(request, timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  minio-data:

# The disposable beta is intentionally egress-isolated. Services communicate
# over Docker DNS and published loopback ports remain available to the host,
# but an AI provider key cannot create an unreviewed internet path.
networks:
  default:
    internal: true
  edge:
    driver: bridge
