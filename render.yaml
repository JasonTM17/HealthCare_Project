# Render Free blueprint for the synthetic HealthCare beta.
#
# This is the canonical hosted manifest for the disposable synthetic beta.
# Keep remote-provider, clinical, storage, mail, payment and AV paths
# fail-closed. The public HOSPITAL_SUPPORT chatbot uses a separate local-only
# FastAPI service on Render Free.
#
# The selected deployment contract intentionally uses only resources available
# on Render Free: PostgreSQL, Key Value, one public Spring web service and one
# public FastAPI web service. Render Free web services cannot receive private
# network traffic, so the Spring-to-AI hop uses HTTPS plus a server-only token.
# Object-storage, mail, payment, and attachment-scanning features remain
# fail-closed until a separately reviewed paid/private topology exists.
# The backend consumes an immutable GHCR digest, so Render never builds or
# stores a Docker image on the operator workstation.

databases:
  - name: healthcare-beta-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: healthcare_beta_postgres
    # This is the rotated default credential identity. The password stays in
    # Render's managed secret store and is never committed.
    user: healthcare_beta_app_20260830r1
    ipAllowList: []

services:
  - type: keyvalue
    name: healthcare-beta-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    # Render Free Key Value is intentionally ephemeral. PostgreSQL remains the
    # transactional authority; Redis is limited to rate limits/realtime fanout.
    persistenceMode: "off"

  - type: web
    name: healthcare-beta-ai
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    buildCommand: python -m pip install --no-cache-dir -r apps/ai-service/requirements.txt
    startCommand: cd apps/ai-service && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /livez
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_CHAT_MODEL
        value: deepseek-flash
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: EMBEDDING_PROVIDER
        value: local
      - key: AI_SERVICE_RUNTIME
        value: render-beta
      - key: AI_SERVICE_ALLOW_UNAUTHENTICATED_LOCAL
        value: "false"
      # [L2 2026-09-30] Patient remote egress ON, as ONE atomic set with the
      # backend AI_CHAT_REMOTE_PROVIDER_ENABLED flip below. Business signature:
      # REMOTE_AI_RELEASE_HOLD=true is the explicit "release hold lifted"
      # commitment -- the ai-service validator (app/config.py:173-176) refuses
      # to boot when the remote keys are on without it (fail-closed; sealed
      # oracle: tests/test_config.py:161 "cannot bypass release hold").
      # Quota consequence: every patient turn WITH a catalog source now costs
      # real remote_llm (deepseek-flash) on the account shared with the public
      # chatbot; the credit gate, weekly refill and AI_CHAT_USAGE attempt
      # markers still apply on the patient path. Turns with NO catalog source
      # stay INSUFFICIENT_EVIDENCE (AiConversationService.java:774-775) until
      # the deferred uncited-guidance code item lands -- this env change does
      # not claim otherwise.
      - key: AI_PATIENT_CHAT_REMOTE_ENABLED
        value: "true"
      - key: REMOTE_AI_RELEASE_HOLD
        value: "true"
      - key: AI_CHAT_REMOTE_PROVIDER_ENABLED
        value: "false"
      - key: AI_PUBLIC_HOSPITAL_SUPPORT_REMOTE_ENABLED
        value: "true"
      # REMOTE_AI_SYNTHETIC_ONLY=false unblocks the second gate at
      # app/llm.py:2623-2631 (render-beta is not synthetic-beta). No side
      # effect: the synthetic 403/embedding branches in chatbot.py only fire
      # when AI_SERVICE_RUNTIME is synthetic-beta, and EMBEDDING_PROVIDER
      # stays local above. REMOTE_AI_KILL_SWITCH is deliberately NOT changed:
      # grep confirms no app consumer (declared only at app/config.py:60) --
      # dead key, flipping it is noise.
      - key: REMOTE_AI_SYNTHETIC_ONLY
        value: "false"
      - key: REMOTE_AI_KILL_SWITCH
        value: "true"
      - key: AI_API_KEY
        sync: false
      - key: RAG_STORAGE_BACKEND
        value: supabase
      # The AI service reads its RAG corpus through this pooled Supabase DSN
      # (RAG_STORAGE_BACKEND=supabase). It is a secret, so it is never committed:
      # the blueprint cannot reproduce the running service without it.
      - key: SUPABASE_DB_URL
        sync: false
      - key: RAG_INGEST_ENABLED
        value: "true"
      - key: RAG_MAX_DOCUMENTS
        value: "10000"
      - key: AI_MAX_RETRIEVED_CHUNKS
        value: "5"
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: RAG_INGEST_TOKEN
        generateValue: true

      # L1 cross-instance keep-warm. A GET from this instance to the backend's
      # public health URL is real inbound HTTPS, so it keeps the backend awake
      # and wakes it after an eviction; the backend's SelfWarmer pings this
      # service's /livez the same way, making the warm chain bidirectional and
      # self-healing. The warmer code already exists (apps/ai-service/app/main.py
      # startup hook) and self-disables when this variable is absent. The URL is
      # a public health endpoint (no credentials), matching the warm cron in
      # .github/workflows/render-warm.yml.
      - key: BACKEND_WARM_URL
        value: https://healthcare-beta-backend-4wb7.onrender.com/actuator/health

  - type: web
    name: healthcare-beta-backend
    runtime: image
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    image:
      url: ghcr.io/jasontm17/healthcare-project-backend@sha256:ff24c19836c60262588752f3f6988aeb0fcb860267754b5c7098c0ec7d5ab85d
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render-beta
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-beta-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: healthcare-beta-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: healthcare-beta-postgres
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: healthcare-beta-redis
          property: connectionString
      - key: APP_SECURITY_RATE_LIMIT_REDIS_REQUIRED
        value: "true"
      - key: CMS_DISTRIBUTED_REALTIME_ENABLED
        value: "true"

      # Low-memory footprint tuning for Render Free 512MB RAM constraint.
      # Caps heap, metaspace, code cache, and thread stack size to prevent OOM restart.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -Xms64m -Xmx180m -XX:MaxMetaspaceSize=128m -Xss384k -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "16"
      - key: SERVER_TOMCAT_THREADS_MIN_SPARE
        value: "2"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"

      # Connection lifecycle for the Free-plan pooler. Render's managed Postgres
      # drops idle connections, so a connection that outlives the server-side
      # idle timeout fails on first use. Recycle every 4 minutes, ping idle
      # connections every minute, and bound validation so a dead socket is
      # rejected instead of handed to a request thread. leak-detection is raised
      # above the 5 s connection timeout: at 5 s it only ever reported normal
      # pool waits as leaks.
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "240000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT
        value: "3000"
      - key: SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD
        value: "30000"

      # HOSPITAL_SUPPORT uses the remote DeepSeek-backed FastAPI service.
      # Clinical modes and synthetic approval paths remain fail-closed.
      - key: AI_SERVICE_URL
        value: https://healthcare-beta-ai-9mip.onrender.com
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: healthcare-beta-ai
          envVarKey: AI_SERVICE_TOKEN
      - key: AI_RAG_INGEST_TOKEN
        fromService:
          type: web
          name: healthcare-beta-ai
          envVarKey: RAG_INGEST_TOKEN
      - key: AI_RAG_INGEST_ENABLED
        value: "true"
      - key: AI_SERVICE_RUNTIME
        value: render-beta
      - key: AI_SERVICE_ALLOW_UNAUTHENTICATED_LOCAL
        value: "false"
      # [L2] Spring-side key of the patient egress set (paired with the
      # healthcare-beta-ai flips above). application.yml:295 binds this to
      # AiConversationService, whose sanitize gate (:1559) otherwise rejects
      # provenance=remote_provider with a 502 AI_RESPONSE_INVALID. Safety
      # guards are unchanged: sanitize re-validation, rejectDiagnoseOrPrescribe,
      # unsafe-claim refusal, circuit breaker, EMERGENCY/HANDOFF pre-gate.
      - key: AI_CHAT_REMOTE_PROVIDER_ENABLED
        value: "true"
      - key: AI_PUBLIC_HOSPITAL_SUPPORT_REMOTE_ENABLED
        value: "true"
      - key: AI_CHAT_SYMPTOM_TRIAGE_ENABLED
        value: "false"
      - key: AI_CHAT_HEALTH_EDUCATION_ENABLED
        value: "false"
      - key: AI_CHAT_SYNTHETIC_BETA_ASSERTED
        value: "false"
      - key: AI_CHAT_CHUNKED_ENABLED
        value: "false"
      - key: RAG_STORAGE_BACKEND
        value: memory
      - key: APP_PUBLIC_SPECIALTY_TRIAGE_ENABLED
        value: "true"

      # These values are server-only. The BFF token must exactly match the
      # Vercel production secret and must never use a NEXT_PUBLIC_* name.
      - key: BFF_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BACKEND_BFF_SERVICE_TOKEN
        sync: false
      - key: BACKEND_BFF_REQUIRED
        value: "true"

      # Disabled subsystems must not make the Render health probe depend on
      # localhost placeholders or unavailable paid/private services.
      - key: APP_MAIL_ENABLED
        value: "false"
      - key: APP_MAIL_OUTBOX_ENABLED
        value: "false"
      - key: MANAGEMENT_HEALTH_MAIL_ENABLED
        value: "false"
      - key: APP_PAYMENT_BANK_TRANSFER_ENABLED
        value: "false"
      - key: STORAGE_REQUIRE_PRIVATE_ENDPOINT
        value: "false"
      - key: STORAGE_UPLOAD_ENABLED
        value: "false"
      - key: STORAGE_CONSULTATION_ENABLED
        value: "false"
      - key: STORAGE_AV_REQUIRED
        value: "false"
      - key: STORAGE_MIME_VALIDATION_REQUIRED
        value: "true"
