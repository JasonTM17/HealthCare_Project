# Render blueprint for the synthetic HealthCare beta.
#
# This file is intentionally a deployment manifest, not deployment evidence.
# Create disposable beta resources in the already-authorized Render workspace;
# never attach this blueprint to a production service. Set every secret in
# Render's secret store. This build rejects remote patient-answer switches;
# keep both disabled as required by docs/deployment-beta.md.

databases:
  - name: healthcare-beta-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: healthcare
    user: healthcare
    # Keep the beta database private; do not expose synthetic data publicly.
    ipAllowList: []

services:
  - type: keyvalue
    name: healthcare-beta-redis
    plan: free
    region: singapore
    # Keep the cache reachable only over Render's private network.
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: pserv
    name: healthcare-beta-ai
    runtime: docker
    region: singapore
    dockerfilePath: ./apps/ai-service/Dockerfile
    dockerContext: ./apps/ai-service
    # Render private services use a TCP port check. `healthCheckPath` is a
    # web-service-only field; application readiness is verified internally
    # with the service token by Spring/synthetic smoke tests.
    envVars:
      - key: AI_SERVICE_RUNTIME
        value: synthetic-beta
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: local
      - key: EMBEDDING_PROVIDER
        value: local
      - key: AI_PATIENT_CHAT_REMOTE_ENABLED
        value: "false"
      - key: AI_CHAT_REMOTE_PROVIDER_ENABLED
        value: "false"
      - key: REMOTE_AI_SYNTHETIC_ONLY
        value: "true"
      - key: REMOTE_AI_KILL_SWITCH
        value: "true"
      - key: RAG_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_RAG_FALLBACK_TO_MEMORY
        value: "false"
      - key: RAG_EMBEDDING_DIMENSION
        value: "384"

  - type: web
    name: healthcare-beta-backend
    runtime: docker
    region: singapore
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render-beta
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-beta-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: healthcare-beta-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: healthcare-beta-postgres
          property: password
      # Render's connectionString is postgres:// or postgresql://. The
      # backend normalizes it to jdbc:postgresql:// before DataSource startup;
      # discrete credentials remain separate and are never embedded in logs.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: healthcare-beta-redis
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: healthcare-beta-ai
          # Render's private-network reference is a host:port pair. The
          # Spring gateway normalizes this to an internal HTTP URL.
          property: hostport
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: AI_CHAT_REMOTE_PROVIDER_ENABLED
        value: "false"
      - key: AI_CHAT_SYMPTOM_TRIAGE_ENABLED
        value: "false"
      - key: AI_CHAT_HEALTH_EDUCATION_ENABLED
        value: "false"
      # Exact public Vercel beta origin(s) accepted only from the authenticated
      # BFF's X-Healthcare-Original-Origin header. Direct browser CORS is off.
      - key: BFF_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      # Configure the same secret in the Vercel server environment. It must
      # never be exposed through NEXT_PUBLIC_* or a browser-visible header.
      - key: BACKEND_BFF_SERVICE_TOKEN
        sync: false
      - key: BACKEND_BFF_REQUIRED
        value: "true"
      - key: APP_MAIL_ENABLED
        value: "false"
      - key: APP_PAYMENT_BANK_TRANSFER_ENABLED
        value: "false"
      # Private S3/R2-compatible storage is mandatory for a deployed beta.
      # Keep uploads off until the operator supplies the endpoint, credentials
      # and a trusted AV/MIME worker through Render's secret store.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: healthcare-beta-private
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_REQUIRE_PRIVATE_ENDPOINT
        value: "true"
      - key: STORAGE_UPLOAD_ENABLED
        value: "false"
      - key: STORAGE_CONSULTATION_ENABLED
        value: "false"
      - key: STORAGE_CONSULTATION_KEY_SIGNING_SECRET
        sync: false
      - key: STORAGE_AV_REQUIRED
        value: "true"
      - key: STORAGE_AV_SERVICE_URL
        sync: false
      - key: STORAGE_AV_SERVICE_TOKEN
        sync: false
      - key: STORAGE_AV_ALLOWED_HOSTS
        sync: false
      - key: STORAGE_MIME_VALIDATION_REQUIRED
        value: "true"
      - key: STORAGE_MIME_VALIDATION_REQUIRED
        value: "true"
