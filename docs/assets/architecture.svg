<text x="990" y="871" text-anchor="middle" class="label">Conditional</text>
<text x="60" y="1060" class="sub">Legend: blue = request/service call; green = data/coordination; dashed purple = configured integration.</text>
<text x="60" y="1088" class="sub">Browser never bypasses Core to reach AI. Redis is not the history authority. Presigned URLs do not prove encryption.</text>
