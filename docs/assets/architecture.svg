<path d="M 600 578 V 710" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
<rect x="544.0" y="632" width="112" height="23" fill="#ffffff" opacity="0.97"/>
<text x="600" y="647" text-anchor="middle" class="label">Coordination</text>
