<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:30px;font-weight:700}.name{font-size:19px;font-weight:700}.sub{font-size:15px;fill:#475569}.label{font-size:14px;font-weight:600}</style>
<rect width="1200" height="1120" fill="#ffffff"/>
<rect width="1200" height="8" fill="#2563eb"/>
<text x="60" y="66" class="title">HealthCare / System architecture</text>
<text x="60" y="96" class="sub">Logical boundaries — source-backed topology; integrations depend on environment.</text>
<rect x="60" y="132" width="1080" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="600.0" y="163" text-anchor="middle" class="name">Browser / user roles</text>
<text x="600.0" y="190" text-anchor="middle" class="sub">Public discovery  ·  Patient  ·  Doctor  ·  Administrator</text>
<rect x="60" y="284" width="1080" height="94" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="600.0" y="315" text-anchor="middle" class="name">Next.js UI + same-origin BFF</text>
<text x="600.0" y="342" text-anchor="middle" class="sub">Route handlers  ·  Origin/CSRF boundary  ·  Server trust token  ·  Request deadlines</text>
<rect x="60" y="452" width="1080" height="126" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="600.0" y="483" text-anchor="middle" class="name">Spring Boot / modular monolith</text>
<text x="600.0" y="510" text-anchor="middle" class="sub">Authentication &amp; ownership  ·  Booking  ·  Clinical records  ·  Consultation &amp; care plans</text>
<text x="600.0" y="534" text-anchor="middle" class="sub">CMS publication  ·  Payments &amp; review  ·  Notifications/outboxes  ·  AI policy &amp; history</text>
<rect x="60" y="710" width="300" height="100" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="210.0" y="741" text-anchor="middle" class="name">PostgreSQL</text>
<text x="210.0" y="768" text-anchor="middle" class="sub">Flyway / transactions</text>
<text x="210.0" y="792" text-anchor="middle" class="sub">Business + session authority</text>
<rect x="450" y="710" width="300" height="100" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="600.0" y="741" text-anchor="middle" class="name">Redis</text>
<text x="600.0" y="768" text-anchor="middle" class="sub">Rate limits / coordination</text>
<text x="600.0" y="792" text-anchor="middle" class="sub">CMS wake-up signals</text>
<rect x="840" y="710" width="300" height="100" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="990.0" y="741" text-anchor="middle" class="name">FastAPI AI</text>
<text x="990.0" y="768" text-anchor="middle" class="sub">Retrieve / generate</text>
<text x="990.0" y="792" text-anchor="middle" class="sub">Validate / runtime policy</text>
<rect x="60" y="918" width="690" height="100" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="405.0" y="949" text-anchor="middle" class="name">Feature-gated integrations</text>
<text x="405.0" y="976" text-anchor="middle" class="sub">MinIO / S3  ·  Scanner adapter + ClamAV  ·  Mailpit / SMTP</text>
<text x="405.0" y="1000" text-anchor="middle" class="sub">Private objects and scan linkage  ·  Mail outbox delivery</text>
<rect x="840" y="918" width="300" height="100" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="990.0" y="949" text-anchor="middle" class="name">RAG / provider selection</text>
<text x="990.0" y="976" text-anchor="middle" class="sub">Memory or protected projection</text>
<text x="990.0" y="1000" text-anchor="middle" class="sub">Remote model when permitted</text>
