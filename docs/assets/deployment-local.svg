<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">HealthCare / Local Compose</title><desc id="desc">Local demo deployment — loopback host ports; internal-only AI; no hosted topology claim.</desc>
