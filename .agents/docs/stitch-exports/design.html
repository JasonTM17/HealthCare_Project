<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; }
        .modal-enter {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-deep-slate/40 backdrop-blur-[2px] z-40 hidden md:block"></div>
<!-- Modal Container -->
<main class="relative z-50 w-full max-w-md bg-surface-container-lowest rounded-t-[24px] md:rounded-[24px] shadow-[0_-8px_30px_rgb(15,23,42,0.1)] md:shadow-2xl overflow-hidden flex flex-col h-[795px] md:h-auto modal-enter mt-auto md:mt-0">
<!-- Drag Handle (Mobile) -->
<div class="w-full flex justify-center pt-3 pb-1 md:hidden bg-surface-container-lowest">
<div class="w-12 h-1 rounded-full bg-outline-variant"></div>
</div>
<!-- Header -->
<header class="flex items-center justify-between px-margin-mobile py-4 bg-surface-container-lowest border-b border-outline-variant/30 sticky top-0 z-10">
<button aria-label="Go back" class="p-2 -ml-2 text-on-surface hover:bg-surface-container-low rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Đặt lịch khám</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto hide-scrollbar pb-[100px]">
<!-- Doctor Profile Card -->
<section class="p-margin-mobile">
<div class="flex items-center gap-4 bg-surface-base border border-outline-variant/50 rounded-xl p-4 transition-all hover:shadow-md hover:-translate-y-[2px]">
<div class="relative w-16 h-16 shrink-0">
<img alt="Bác sĩ Nguyễn Văn A" class="w-full h-full object-cover rounded-full border-2 border-surface-container-lowest shadow-sm" data-alt="A highly professional portrait of a Vietnamese female doctor in a pristine white medical coat. She is smiling warmly in a bright, modern hospital environment. The lighting is high-key, soft white, emphasizing a clean, authoritative, and reassuring medical aesthetic with subtle teal accents in the background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBh6vPRFeRrCIiJo4mqYUM4q0nbUNSYIrK5C2MuRopNCNMlNrisewx9-g5Bj9v80hhtZCaS0OpSZWZBXttold9597pZVW8nr1eKqTRNJfb8E7jYWFJbajxVOobJH9CxoQMhAXbAJOg_-dSRJoYLHTYS-5hoHnTzqltwIfD2EjFb41UumQXSxfT-ke-iZICPULxnuGViY49lJVL2kONjbS9qwScdpjcMSIRHUmSqhAsyVRDfWbRmbl9O4OAinWoAqSHRKFzqFtLCfaYD"/>
<div class="absolute bottom-0 right-0 w-4 h-4 bg-success-emerald border-2 border-surface-container-lowest rounded-full"></div>
</div>
<div class="flex flex-col">
<h2 class="font-label-lg text-label-lg text-on-surface mb-1">Bác sĩ: Nguyễn Văn A</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mb-1">Chuyên khoa: Nội tổng quát</p>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[#F59E0B] text-[16px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-md text-label-md text-on-surface">4.9</span>
<span class="font-body-md text-body-md text-on-surface-variant text-xs">(120 đánh giá)</span>
</div>
</div>
</div>
</section>
<!-- Date Picker -->
<section class="px-margin-mobile mb-6">
<div class="flex justify-between items-center mb-3">
<h3 class="font-label-lg text-label-lg text-on-surface">Tháng 10, 2024</h3>
<div class="flex gap-2">
<button class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors"><span class="material-symbols-outlined text-[20px]">chevron_left</span></button>
<button class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors"><span class="material-symbols-outlined text-[20px]">chevron_right</span></button>
</div>
</div>
<div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 -mx-margin-mobile px-margin-mobile snap-x">
<!-- Date Items -->
<button class="snap-start shrink-0 w-[64px] h-[80px] rounded-xl border border-outline-variant/50 bg-surface-base flex flex-col items-center justify-center gap-1 transition-all hover:bg-surface-container-low">
<span class="font-label-md text-label-md text-on-surface-variant">T2</span>
<span class="font-headline-md text-[20px] font-semibold text-on-surface">14</span>
</button>
<!-- Active State -->
<button class="snap-start shrink-0 w-[64px] h-[80px] rounded-xl border-2 border-medical-teal bg-medical-teal/10 flex flex-col items-center justify-center gap-1 transition-all shadow-sm">
<span class="font-label-md text-label-md text-medical-teal font-semibold">T3</span>
<span class="font-headline-md text-[20px] font-semibold text-medical-teal">15</span>
</button>
<button class="snap-start shrink-0 w-[64px] h-[80px] rounded-xl border border-outline-variant/50 bg-surface-base flex flex-col items-center justify-center gap-1 transition-all hover:bg-surface-container-low">
<span class="font-label-md text-label-md text-on-surface-variant">T4</span>
<span class="font-headline-md text-[20px] font-semibold text-on-surface">16</span>
</button>
<button class="snap-start shrink-0 w-[64px] h-[80px] rounded-xl border border-outline-variant/50 bg-surface-base flex flex-col items-center justify-center gap-1 transition-all hover:bg-surface-container-low">
<span class="font-label-md text-label-md text-on-surface-variant">T5</span>
<span class="font-headline-md text-[20px] font-semibold text-on-surface">17</span>
</button>
<button class="snap-start shrink-0 w-[64px] h-[80px] rounded-xl border border-outline-variant/50 bg-surface-base flex flex-col items-center justify-center gap-1 transition-all hover:bg-surface-container-low">
<span class="font-label-md text-label-md text-on-surface-variant">T6</span>
<span class="font-headline-md text-[20px] font-semibold text-on-surface">18</span>
</button>
</div>
</section>
<!-- Time Slot Grid -->
<section class="px-margin-mobile mb-6">
<h3 class="font-label-lg text-label-lg text-on-surface mb-3">Giờ khám</h3>
<div class="grid grid-cols-3 gap-3">
<button class="py-3 rounded-lg border border-outline-variant/50 bg-surface-base font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors">08:00</button>
<button class="py-3 rounded-lg border border-outline-variant/50 bg-surface-base font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors">08:30</button>
<!-- Active State -->
<button class="py-3 rounded-lg border-2 border-medical-teal bg-medical-teal/10 font-label-lg text-label-lg text-medical-teal transition-colors shadow-sm">09:00</button>
<button class="py-3 rounded-lg border border-outline-variant/50 bg-surface-base font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors">09:30</button>
<button class="py-3 rounded-lg border border-outline-variant/50 bg-surface-base font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors">10:00</button>
<button class="py-3 rounded-lg border border-outline-variant/50 bg-surface-base font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors">10:30</button>
</div>
</section>
<!-- Summary Section -->
<section class="px-margin-mobile mb-6">
<div class="bg-surface-container-low rounded-xl p-4 border border-outline-variant/30">
<div class="flex items-center justify-between mb-3 border-b border-outline-variant/30 pb-3">
<h3 class="font-label-lg text-label-lg text-on-surface">Thông tin đặt lịch</h3>
<span class="inline-flex items-center gap-1 bg-success-emerald/10 text-success-emerald px-2 py-1 rounded-full font-label-md text-label-md text-xs">
<span class="material-symbols-outlined text-[14px]">verified</span>
                            Đã xác thực
                        </span>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Ngày:</span>
<span class="font-label-lg text-label-lg text-on-surface">Thứ 3, 15/10/2024</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Giờ:</span>
<span class="font-label-lg text-label-lg text-on-surface">09:00</span>
</div>
</div>
</div>
</section>
</div>
<!-- Footer CTA -->
<footer class="absolute bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant/30 p-margin-mobile pb-[max(20px,env(safe-area-inset-bottom))] z-20">
<button class="w-full bg-medical-teal hover:bg-secondary text-on-primary font-label-lg text-label-lg py-4 rounded-xl shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span>Xác nhận đặt lịch</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</footer>
</main>
<script>
        // Simple micro-interaction for date and time buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', function() {
                if(!this.classList.contains('bg-medical-teal')) {
                    this.style.transform = 'scale(0.98)';
                }
            });
            btn.addEventListener('mouseup', function() {
                if(!this.classList.contains('bg-medical-teal')) {
                    this.style.transform = 'scale(1)';
                }
            });
            btn.addEventListener('mouseleave', function() {
                if(!this.classList.contains('bg-medical-teal')) {
                    this.style.transform = 'scale(1)';
                }
            });
        });
    </script>
</body></html>
