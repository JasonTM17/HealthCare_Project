name: Publish database package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "40-character Git commit SHA to publish when manually publishing"
        required: true
        type: string
      image_tag:
        description: "Optional image tag without the leading v"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: beta-database-${{ github.event.inputs.source_ref || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source and tags
        id: source
        shell: bash
        env:
          MANUAL_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '' }}
          MANUAL_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
        run: |
          set -euo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/healthcare-project-database"
          source_sha="$(git rev-parse HEAD)"
          source_created="$(git show -s --format=%cI "$source_sha")"

          if [ -n "$MANUAL_SOURCE_REF" ]; then
            if [[ ! "$MANUAL_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::workflow_dispatch source_ref must be a lowercase 40-character commit SHA"
              exit 1
            fi
            if [ "$MANUAL_SOURCE_REF" != "$source_sha" ]; then
              echo "::error::Checked out SHA $source_sha does not match requested source_ref $MANUAL_SOURCE_REF"
              exit 1
            fi
            if [ "${GITHUB_SHA:-}" != "$MANUAL_SOURCE_REF" ]; then
              echo "::error::workflow_dispatch must be launched with --ref equal to source_ref so the signed attestation binds the release SHA"
              exit 1
            fi
          fi

          declare -a requested_tags=("${image_name}:sha-${source_sha}")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9] ]]; then
            requested_tags+=("${image_name}:${GITHUB_REF_NAME#v}")
          fi
          if [ -n "$MANUAL_IMAGE_TAG" ]; then
            if [[ ! "$MANUAL_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::image_tag must be a valid Docker tag"
              exit 1
            fi
            manual_image_tag_normalized="${MANUAL_IMAGE_TAG,,}"
            if [[ "$manual_image_tag_normalized" =~ ^sha-[0-9a-f]{40}$ ]] && [ "$manual_image_tag_normalized" != "sha-${source_sha}" ]; then
              echo "::error::SHA-like image_tag aliases must match the checked-out source SHA"
              exit 1
            fi
            if [[ "$manual_image_tag_normalized" =~ ^sha-[0-9a-f]{40}$ ]] && [ "$MANUAL_IMAGE_TAG" != "sha-${source_sha}" ]; then
              echo "::error::SHA image_tag aliases must use canonical lowercase sha-<source_sha>"
              exit 1
            fi
            requested_tags+=("${image_name}:${MANUAL_IMAGE_TAG}")
          fi

          declare -a unique_tags=()
          for tag in "${requested_tags[@]}"; do
            seen=false
            for existing in "${unique_tags[@]}"; do
              if [ "$existing" = "$tag" ]; then
                seen=true
                break
              fi
            done
            if [ "$seen" = false ]; then
              unique_tags+=("$tag")
            fi
          done

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "created=$source_created" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${unique_tags[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s\n' "${unique_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful exact-SHA CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            success_count="$(gh run list --workflow ci.yml --commit "$SOURCE_SHA" --limit 20 --json status,conclusion,headSha \
              --jq '[.[] | select(.headSha == "'"$SOURCE_SHA"'" and .status == "completed" and .conclusion == "success")] | length')"
            if [ "$success_count" -ge 1 ]; then
              echo "Found successful CI run for $SOURCE_SHA"
              exit 0
            fi
            echo "Waiting for successful CI run for $SOURCE_SHA ($attempt/30)"
            sleep 10
          done
          echo "::error::No successful ci.yml run found for exact SHA $SOURCE_SHA"
          exit 1

      - name: Build verified database image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.source.outputs.tags }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_CREATED: ${{ steps.source.outputs.created }}
        run: |
          set -euo pipefail

          declare -a tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          docker build \
            --file infrastructure/database/Dockerfile \
            --label "org.opencontainers.image.created=$SOURCE_CREATED" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            "${tag_args[@]}" \
            .

      - name: Initialize and verify database image
        shell: bash
        env:
          PRIMARY_TAG: ${{ steps.source.outputs.primary_tag }}
        run: |
          set -euo pipefail

          container=healthcare-database-publish
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run --detach --name "$container" --tmpfs /var/lib/postgresql/data:rw \
            --env POSTGRES_DB=healthcare \
            --env POSTGRES_USER=healthcare \
            --env POSTGRES_PASSWORD=ci-only \
            "$PRIMARY_TAG" >/dev/null

          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U healthcare -d healthcare >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi

          verified=false
          for attempt in $(seq 1 180); do
            if counts="$(docker exec "$container" psql -At -F '|' -U healthcare -d healthcare -c \
              "SELECT 'articles', count(*) FROM articles UNION ALL SELECT 'doctors', count(*) FROM doctors UNION ALL SELECT 'packages', count(*) FROM packages UNION ALL SELECT 'users', count(*) FROM users UNION ALL SELECT 'job_positions', count(*) FROM job_positions UNION ALL SELECT 'job_applications', count(*) FROM job_applications;" 2>/dev/null)"; then
              if grep -Fx 'articles|500' <<<"$counts" >/dev/null \
                && grep -Fx 'doctors|500' <<<"$counts" >/dev/null \
                && grep -Fx 'packages|100' <<<"$counts" >/dev/null \
                && grep -Fx 'users|1001' <<<"$counts" >/dev/null \
                && grep -Fx 'job_positions|4' <<<"$counts" >/dev/null \
                && grep -Fx 'job_applications|0' <<<"$counts" >/dev/null \
                && [ "$(docker exec "$container" psql -At -U healthcare -d healthcare -c \
                  "SELECT count(*) FROM information_schema.columns WHERE table_name = 'cms_content_changes' AND column_name IN ('actor_email','payload','previous_payload','public_event');" \
                  2>/dev/null)" = 4 ] \
                && [ "$(docker exec "$container" psql -At -U healthcare -d healthcare -c \
                  "SELECT count(*) FROM pg_constraint WHERE conname IN ('ck_cms_contents_slot_component_type','ck_cms_content_changes_slot_component_type');" \
                  2>/dev/null)" = 2 ]; then
                printf '%s\n' "$counts"
                verified=true
                break
              fi
            fi
            sleep 1
          done
          if [ "$verified" != true ]; then
            docker logs "$container"
            exit 1
          fi

          if constraint_error="$(docker exec "$container" psql -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -U healthcare -d healthcare -c \
            "INSERT INTO cms_contents (id, slot_key, component_type, payload, status, version, created_at, updated_at) VALUES ('00000000-0000-0000-0000-000000000024','careers.hero','RICH_TEXT','{\"title\":\"Wrong hero\",\"body\":\"Ignored\"}'::jsonb,'PUBLISHED',1,now(),now());" 2>&1)"; then
            echo "::error::Invalid hero/RICH_TEXT CMS row was accepted by the database image"
            exit 1
          fi
          if ! grep -Eq '23514|check_violation' <<<"$constraint_error" \
            || ! grep -Fq 'ck_cms_contents_slot_component_type' <<<"$constraint_error"; then
            echo "::error::Invalid hero/RICH_TEXT CMS row failed for an unexpected reason"
            printf '%s\n' "$constraint_error"
            exit 1
          fi

      - name: Generate database fixture SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.source.outputs.primary_tag }}
          format: spdx-json
          output-file: ${{ runner.temp }}/healthcare-database-fixture.spdx.json
          upload-artifact: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable database SHA tag
        shell: bash
        env:
          PRIMARY_TAG: ${{ steps.source.outputs.primary_tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$PRIMARY_TAG" >/dev/null 2>&1; then
            echo "::error::Immutable database image tag already exists: $PRIMARY_TAG"
            exit 1
          fi

      - name: Push verified database image
        id: push
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.source.outputs.tags }}
          PRIMARY_TAG: ${{ steps.source.outputs.primary_tag }}
        run: |
          set -euo pipefail

          digest=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            push_output="$(docker push "$tag")"
            printf '%s\n' "$push_output"
            if [ "$tag" = "$PRIMARY_TAG" ]; then
              digest="$(awk '/digest:/ {print $3}' <<<"$push_output" | tail -n 1)"
            fi
          done <<< "$IMAGE_TAGS"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve pushed digest for $PRIMARY_TAG"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify published database digest and immutable SHA tag
        shell: bash
        env:
          PRIMARY_TAG: ${{ steps.source.outputs.primary_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$PRIMARY_TAG" != *":sha-"* ]]; then
            echo "::error::Primary database tag must be the canonical sha-<source_sha> tag"
            exit 1
          fi
          resolved_digest="$(docker buildx imagetools inspect "$PRIMARY_TAG" --format '{{json .Manifest.Digest}}' | tr -d '\"')"
          if [ "$resolved_digest" != "$DIGEST" ]; then
            echo "::error::Registry digest $resolved_digest does not match pushed digest $DIGEST"
            exit 1
          fi
          echo "$PRIMARY_TAG@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest database image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.source.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest database fixture SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.source.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/healthcare-database-fixture.spdx.json
          push-to-registry: true
