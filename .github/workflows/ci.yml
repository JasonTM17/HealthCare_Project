name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healthcare_test
          POSTGRES_USER: healthcare_test
          POSTGRES_PASSWORD: healthcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker run --detach --name healthcare-ci-minio --network host \
            --env MINIO_ROOT_USER=healthcare \
            --env MINIO_ROOT_PASSWORD=change-me \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs healthcare-ci-minio
          exit 1
      - name: Build and test backend
        working-directory: apps/backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/healthcare_test
          TEST_DB_ALLOW_CLEANUP: true
          TEST_DB_USERNAME: healthcare_test
          TEST_DB_PASSWORD: healthcare_test
        run: mvn -B verify
      - name: Stop MinIO
        if: always()
        run: docker rm --force healthcare-ci-minio || true
      - name: Upload backend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: apps/backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Lint
        working-directory: apps/frontend
        run: npm run lint
      - name: Type check
        working-directory: apps/frontend
        run: npm run typecheck
      - name: Test
        working-directory: apps/frontend
        run: npm run test
      - name: Build
        working-directory: apps/frontend
        run: npm run build
      - name: Upload frontend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-build
          path: apps/frontend/.next
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: apps/ai-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint
        working-directory: apps/ai-service
        run: python -m ruff check .
      - name: Type check
        working-directory: apps/ai-service
        run: python -m mypy
      - name: Run tests
        working-directory: apps/ai-service
        run: python -m pytest

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_SECRET: ci-only-jwt-secret-with-no-production-value
      AI_SERVICE_TOKEN: ci-only-ai-service-token
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose -f infrastructure/docker-compose.yml config --quiet

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build database fixture image
        run: docker build --file infrastructure/database/Dockerfile --tag healthcare-project-database:ci .
      - name: Initialize and verify large dataset
        shell: bash
        run: |
          set -euo pipefail
          container=healthcare-database-ci
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" --tmpfs /var/lib/postgresql/data:rw \
            --env POSTGRES_DB=healthcare \
            --env POSTGRES_USER=healthcare \
            --env POSTGRES_PASSWORD=ci-only \
            healthcare-project-database:ci >/dev/null
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U healthcare -d healthcare >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi
          initialized=false
          for attempt in $(seq 1 120); do
            if docker exec "$container" psql -At -U healthcare -d healthcare -c \
              "SELECT to_regclass('public.articles');" 2>/dev/null | grep -Fxq articles; then
              initialized=true
              break
            fi
            sleep 1
          done
          if [ "$initialized" != true ]; then
            docker logs "$container"
            exit 1
          fi
          counts="$(docker exec "$container" psql -At -F '|' -U healthcare -d healthcare -c \
            "SELECT 'articles', count(*) FROM articles UNION ALL SELECT 'doctors', count(*) FROM doctors UNION ALL SELECT 'packages', count(*) FROM packages UNION ALL SELECT 'users', count(*) FROM users;")"
          grep -Fx 'articles|500' <<<"$counts"
          grep -Fx 'doctors|500' <<<"$counts"
          grep -Fx 'packages|100' <<<"$counts"
          grep -Fx 'users|1000' <<<"$counts"

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero_sha" ]; then
            git diff --check "$BEFORE_SHA...$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
      - name: Check tracked secret files and credential-shaped values
        run: |
          set -euo pipefail

          forbidden_files="$({
            git ls-files | grep -E '(^|/)\.env(\..*)?$|\.(pem|key|p12|pfx)$'
          } | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden_files" ]; then
            echo "::error::Tracked environment or private-key files detected"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

          credential_files="$(git grep -I -l -e '-----BEGIN (RSA|EC|OPENSSH|DSA|PGP|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' HEAD -- . || true)"
          if [ -n "$credential_files" ]; then
            echo "::error::Credential-shaped content detected in tracked files"
            printf '%s\n' "$credential_files"
            exit 1
          fi
