name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healthcare_test
          POSTGRES_USER: healthcare_test
          POSTGRES_PASSWORD: healthcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: apps/backend/pom.xml
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker run --detach --name healthcare-ci-minio --network host \
            --env MINIO_ROOT_USER=healthcare \
            --env MINIO_ROOT_PASSWORD=change-me \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs healthcare-ci-minio
          exit 1
      - name: Warm Maven wrapper
        working-directory: apps/backend
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./mvnw -B -v; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven wrapper bootstrap failed after $attempt attempts"
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning::Maven wrapper bootstrap failed on attempt $attempt; retrying in ${delay}s"
            sleep "$delay"
          done
      - name: Build and test backend
        working-directory: apps/backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/healthcare_test
          TEST_DB_ALLOW_CLEANUP: true
          TEST_DB_USERNAME: healthcare_test
          TEST_DB_PASSWORD: healthcare_test
        run: ./mvnw -B verify
      - name: Stop MinIO
        if: always()
        run: docker rm --force healthcare-ci-minio || true
      - name: Upload backend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: apps/backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Lint
        working-directory: apps/frontend
        run: npm run lint
      - name: Type check
        working-directory: apps/frontend
        run: npm run typecheck
      - name: Test
        working-directory: apps/frontend
        run: npm run test
      - name: Build
        working-directory: apps/frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium
      - name: Browser test CMS realtime
        working-directory: apps/frontend
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-diagnostics
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload frontend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-build
          path: apps/frontend/.next
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: apps/ai-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint
        working-directory: apps/ai-service
        run: python -m ruff check .
      - name: Type check
        working-directory: apps/ai-service
        run: python -m mypy
      - name: Run tests
        working-directory: apps/ai-service
        run: python -m pytest

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_SECRET: ci-only-jwt-secret-with-no-production-value
      AI_SERVICE_TOKEN: ci-only-ai-service-token
      RAG_INGEST_TOKEN: ci-only-rag-ingest-token
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose -f infrastructure/docker-compose.yml config --quiet
      - name: Validate operational PowerShell contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("scripts/backup-local-data.ps1", "scripts/validate-production-env.ps1")) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$null, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "$path has PowerShell parse errors."
            }
          }

          & pwsh -NoProfile -File scripts/validate-production-env.ps1 -EnvFile .env.example *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "The local .env.example must fail the production environment gate."
          }

          $fixture = Join-Path $env:RUNNER_TEMP "healthcare-production-validation.env"
          @(
            "SPRING_PROFILES_ACTIVE=prod"
            "JWT_SECRET=validation-only-jwt-xxxxxxxxxxxxxxxxxxxxxxxx"
            "POSTGRES_PASSWORD=validation-postgres-xxxxxxxx"
            "DATABASE_PASSWORD=validation-database-xxxxxxxx"
            "MINIO_ROOT_PASSWORD=validation-minio-xxxxxxxx"
            "AI_SERVICE_TOKEN=validation-ai-token-xxxxxxxxxxxxxxxxxxxx"
            "APP_BOOKING_ALLOW_TEST_OTP=false"
            "APP_SECURITY_RATE_LIMIT_ENABLED=true"
            "CORS_ALLOWED_ORIGINS=https://healthcare.invalid"
            "APP_MAIL_ENABLED=true"
            "APP_MAIL_FROM=no-reply@healthcare.invalid"
            "SPRING_MAIL_HOST=smtp.healthcare.invalid"
            "SPRING_MAIL_SMTP_AUTH=true"
            "SPRING_MAIL_STARTTLS_ENABLE=true"
            "SPRING_MAIL_STARTTLS_REQUIRED=true"
            "SPRING_MAIL_USERNAME=smtp-user@healthcare.invalid"
            "SPRING_MAIL_PASSWORD=validation-smtp-xxxxxxxx"
            "APP_PAYMENT_BANK_TRANSFER_ENABLED=true"
            "PAYMENT_BANK_NAME=Vietcombank"
            "PAYMENT_BANK_ACCOUNT_HOLDER=HEALTHCARE VALIDATION"
            "PAYMENT_BANK_BIN=970436"
            "PAYMENT_BANK_ACCOUNT=1000000000"
            "PAYMENT_DEFAULT_AMOUNT=200000"
            "PAYMENT_WEBHOOK_SECRET=validation-webhook-xxxxxxxxxxxxxxxxxxxxxxxx"
            "PAYMENT_WEBHOOK_TOLERANCE_SECONDS=300"
            "RAG_INGEST_ENABLED=false"
          ) | Set-Content -LiteralPath $fixture -Encoding utf8NoBOM
          & ./scripts/validate-production-env.ps1 -EnvFile $fixture

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build database fixture image
        run: docker build --file infrastructure/database/Dockerfile --tag healthcare-project-database:ci .
      - name: Initialize and verify large dataset
        shell: bash
        run: |
          set -euo pipefail
          container=healthcare-database-ci
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" --tmpfs /var/lib/postgresql/data:rw \
            --env POSTGRES_DB=healthcare \
            --env POSTGRES_USER=healthcare \
            --env POSTGRES_PASSWORD=ci-only \
            healthcare-project-database:ci >/dev/null
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U healthcare -d healthcare >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi
          verified=false
          for attempt in $(seq 1 180); do
            if counts="$(docker exec "$container" psql -At -F '|' -U healthcare -d healthcare -c \
              "SELECT 'articles', count(*) FROM articles UNION ALL SELECT 'doctors', count(*) FROM doctors UNION ALL SELECT 'packages', count(*) FROM packages UNION ALL SELECT 'users', count(*) FROM users UNION ALL SELECT 'job_positions', count(*) FROM job_positions UNION ALL SELECT 'job_applications', count(*) FROM job_applications;" 2>/dev/null)"; then
              if grep -Fx 'articles|500' <<<"$counts" >/dev/null \
                && grep -Fx 'doctors|500' <<<"$counts" >/dev/null \
                && grep -Fx 'packages|100' <<<"$counts" >/dev/null \
                && grep -Fx 'users|1001' <<<"$counts" >/dev/null \
                && grep -Fx 'job_positions|4' <<<"$counts" >/dev/null \
                && grep -Fx 'job_applications|0' <<<"$counts" >/dev/null \
                && [ "$(docker exec "$container" psql -At -U healthcare -d healthcare -c \
                  "SELECT count(*) FROM information_schema.columns WHERE table_name = 'cms_content_changes' AND column_name IN ('actor_email','payload','previous_payload','public_event');" \
                  2>/dev/null)" = 4 ]; then
                printf '%s\n' "$counts"
                verified=true
                break
              fi
            fi
            sleep 1
          done
          if [ "$verified" != true ]; then
            docker logs "$container"
            exit 1
          fi

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero_sha" ]; then
            git diff --check "$BEFORE_SHA...$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
      - name: Check tracked secret files and credential-shaped values
        run: |
          set -euo pipefail

          forbidden_files="$({
            git ls-files | grep -E '(^|/)\.env(\..*)?$|\.(pem|key|p12|pfx)$'
          } | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden_files" ]; then
            echo "::error::Tracked environment or private-key files detected"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

          credential_files="$(git grep -I -l -e '-----BEGIN (RSA|EC|OPENSSH|DSA|PGP|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' HEAD -- . || true)"
          if [ -n "$credential_files" ]; then
            echo "::error::Credential-shaped content detected in tracked files"
            printf '%s\n' "$credential_files"
            exit 1
          fi
