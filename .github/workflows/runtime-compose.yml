name: Runtime Compose MVP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: healthcare-runtime-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker engine
        run: docker info

      - name: Start and verify full local MVP stack
        shell: pwsh
        env:
          HEALTHCARE_RUNTIME_ENV: ${{ runner.temp }}/healthcare-runtime.env
        run: ./scripts/start-and-verify-local-mvp.ps1 -EnvFile $env:HEALTHCARE_RUNTIME_ENV -DockerPath /usr/bin/docker

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend browser dependencies
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run live role and payment browser journeys
        working-directory: apps/frontend
        env:
          # Keep the browser origin identical to BFF_PUBLIC_ORIGIN generated
          # by the local bootstrap.  Mixing loopback hostnames breaks cookie
          # scope and turns successful logins into redirects to /auth/login.
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_BASE_URL: http://localhost:8080/api/v1
          PLAYWRIGHT_MAILPIT_API_URL: http://localhost:8025
        run: npm run test:e2e:compose

      - name: Collect Compose diagnostics
        if: failure()
        shell: pwsh
        env:
          HEALTHCARE_RUNTIME_ENV: ${{ runner.temp }}/healthcare-runtime.env
        run: |
          $composeArgs = @("compose")
          if (Test-Path -LiteralPath $env:HEALTHCARE_RUNTIME_ENV) {
            $composeArgs += @("--env-file", $env:HEALTHCARE_RUNTIME_ENV)
          }
          $composeArgs += @("-f", "infrastructure/docker-compose.yml")
          & /usr/bin/docker @composeArgs ps
          & /usr/bin/docker @composeArgs logs --tail 160 backend frontend ai-service local-seed postgres redis minio

      - name: Stop Compose stack
        if: always()
        shell: pwsh
        env:
          HEALTHCARE_RUNTIME_ENV: ${{ runner.temp }}/healthcare-runtime.env
        run: |
          $composeArgs = @("compose")
          if (Test-Path -LiteralPath $env:HEALTHCARE_RUNTIME_ENV) {
            $composeArgs += @("--env-file", $env:HEALTHCARE_RUNTIME_ENV)
          }
          $composeArgs += @("-f", "infrastructure/docker-compose.yml", "down", "--remove-orphans")
          & /usr/bin/docker @composeArgs
