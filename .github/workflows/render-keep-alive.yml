name: Supabase Keep-Alive (Prevent Auto-Pause) & Render Health

on:
  schedule:
    # Runs every 4 hours (UTC) to keep Supabase active 24/7 and prevent the 7-day
    # inactivity pause. Cadence note: Render Free idles a web service after ~15
    # minutes, so a 4-hourly cron cannot keep the backend or the AI service warm —
    # this job is a health canary plus Supabase activity, not a warmer. Real
    # visitor traffic (and the frontend's own bounded warm-up request) is what
    # keeps cold starts rare.
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    name: Supabase 24/7 Keep-Alive & Active Query
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Supabase keep-alive configuration
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Policy: the management token runs SQL, while the anon key authenticates
          # REST/Auth probes. The project ref is required so every probe targets
          # the same project. Missing values fail the job instead of skipping work.
          for required in SUPABASE_TOKEN PROJECT_REF SUPABASE_ANON_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Required Supabase keep-alive secret/configuration '$required' is missing."
              exit 1
            fi
          done

      - name: Execute Active PostgreSQL Query via Supabase API
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "=== Executing Active Postgres Query on Supabase ==="
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          set +e
          http_code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$response_file" -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query": "SELECT 1 AS keep_alive, count(*) AS active_branches FROM branches WHERE active = true;"}')"
          curl_exit=$?
          set -e
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Supabase SQL probe failed at the network/curl layer (exit $curl_exit)."
            exit 1
          fi
          echo "PostgreSQL Query HTTP Response: $http_code"
          if [[ ! "$http_code" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Supabase SQL probe returned HTTP $http_code."
            exit 1
          fi
          # The management API probe returns one JSON document containing exactly
          # one keep-alive row; preserve that raw response shape.
          jq_filter='def exactly_one_document:
            if type != "array" then false
            elif length != 1 then false
            else .[0]
            end;
            def nonnegative_integer:
              if type != "number" then false
              elif (isfinite | not) then false
              else floor == . and . >= 0
              end;
            def keep_alive_integer_one:
              if type != "number" then false
              elif (isfinite | not) then false
              else floor == . and . == 1
              end;
            def sql_success:
              if type != "array" then false
              elif length != 1 then false
              elif (.[0] | type) != "object" then false
              elif ((.[0] | keys_unsorted | sort) != ["active_branches", "keep_alive"]) then false
              else ((.[0].keep_alive | keep_alive_integer_one)
                and (.[0].active_branches | nonnegative_integer))
              end;
            exactly_one_document | sql_success'
          if ! jq -e -s "$jq_filter" "$response_file" >/dev/null 2>&1; then
            echo "::error::Supabase SQL probe returned an invalid 2xx response body."
            exit 1
          fi
          echo "Active PostgreSQL transaction executed successfully. Supabase activity reset!"

      - name: Ping Supabase REST Gateway
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          echo "=== Pinging Supabase REST Gateway ==="
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          set +e
          http_code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$response_file" -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "https://${PROJECT_REF}.supabase.co/rest/v1/branches?select=id&limit=1")"
          curl_exit=$?
          set -e
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Supabase REST gateway probe failed at the network/curl layer (exit $curl_exit)."
            exit 1
          fi
          echo "Supabase REST Gateway Response: $http_code"
          if [[ ! "$http_code" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Supabase REST gateway returned HTTP $http_code."
            exit 1
          fi
          # The public table endpoint is the REST reachability oracle. It returns
          # at most one explicitly selected branch id and never exposes the body.
          jq_filter='def exactly_one_document:
            if type != "array" then false
            elif length != 1 then false
            else .[0]
            end;
            def nonnull_scalar:
              if type == "number" then isfinite
              else (type == "string") or (type == "boolean")
              end;
            def rest_success:
              if type != "array" then false
              elif length > 1 then false
              else all(.[];
                (type == "object")
                and ((keys_unsorted | sort) == ["id"])
                and (.id | nonnull_scalar)
              )
              end;
            exactly_one_document | rest_success'
          if ! jq -e -s "$jq_filter" "$response_file" >/dev/null 2>&1; then
            echo "::error::Supabase REST gateway returned an invalid 2xx response body."
            exit 1
          fi
          echo "Supabase REST gateway is active and recorded."

      - name: Ping Supabase Auth Health
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          echo "=== Pinging Supabase Auth Gateway ==="
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          set +e
          auth_code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$response_file" -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "https://${PROJECT_REF}.supabase.co/auth/v1/health")"
          curl_exit=$?
          set -e
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Supabase Auth gateway probe failed at the network/curl layer (exit $curl_exit)."
            exit 1
          fi
          echo "Supabase Auth Gateway Response: $auth_code"
          if [[ ! "$auth_code" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Supabase Auth gateway returned HTTP $auth_code."
            exit 1
          fi
          # Auth health has a deliberately narrow allowlist. Supabase currently
          # returns a nonempty description in addition to name and version.
          jq_filter='def exactly_one_document:
            if type != "array" then false
            elif length != 1 then false
            else .[0]
            end;
            def nonempty_string:
            if type != "string" then false else length > 0 end;
            def auth_success:
              if type != "object" then false
              elif ((keys_unsorted | sort) != ["name", "version"]
                and (keys_unsorted | sort) != ["description", "name", "version"]) then false
              elif .name != "GoTrue" then false
              elif ((.version | nonempty_string) | not) then false
              elif (has("description") and ((.description | nonempty_string) | not)) then false
              else true
              end;
            exactly_one_document | auth_success'
          if ! jq -e -s "$jq_filter" "$response_file" >/dev/null 2>&1; then
            echo "::error::Supabase Auth gateway returned an invalid 2xx response body."
            exit 1
          fi
          echo "Supabase Auth gateway is active and recorded."

      - name: Verify Inactivity Reset
        run: |
          set -euo pipefail
          echo "Supabase 24/7 keep-alive routine completed successfully. Activity recorded!"

  render-health:
    name: Render Services Health (fail loud when instances vanish)
    runs-on: ubuntu-latest
    # Worst case is two services x (3 attempts x 90 s probe + 2 x 20 s backoff)
    # = ~620 s, because a Render Free instance has to finish booting before it
    # can answer at all.
    timeout-minutes: 15
    steps:
      - name: Probe backend and AI health endpoints with retry
        run: |
          set -euo pipefail
          declare -A targets=(
            ["backend"]="https://healthcare-beta-backend-4wb7.onrender.com/actuator/health"
            ["ai"]="https://healthcare-beta-ai-9mip.onrender.com/livez"
          )
          failed=0
          for name in backend ai; do
            url="${targets[$name]}"
            success=0
            for attempt in 1 2 3; do
              echo "Probing $name (attempt $attempt/3): $url"
              # --max-time has to outlast a Free-plan cold start (measured:
              # backend 20.4 s, AI 42.5 s). The previous 45 s ceiling aborted the
              # probe while the instance was still booting, which turned a
              # healthy service into a reported outage.
              headers=$(curl -s -D - -o /dev/null --max-time 90 "$url" || true)
              code=$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')
              # Informational only. Cloudflare fronts Render, so Render's router
              # header (`x-render-routing`) is no longer observable and the
              # surviving `x-render-origin-server` value is not a health signal:
              # the status code alone decides.
              origin_server=$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="x-render-origin-server" {print $2}' | tr -d '\r')
              echo "$name: http=${code:-unknown} x-render-origin-server=${origin_server:-absent}"
              if [ "$code" = "200" ]; then
                echo "$name is healthy and active."
                success=1
                break
              fi
              if [ $attempt -lt 3 ]; then
                echo "Sleeping 20s before retry to handle potential cold-start..."
                sleep 20
              fi
            done
            if [ $success -ne 1 ]; then
              echo "::error::Render service '$name' is DOWN after 3 attempts. Check Render dashboard: instance hours exhausted, failed deploy, or suspended service."
              failed=1
            fi
          done
          exit $failed
