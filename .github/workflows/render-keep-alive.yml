name: Supabase Keep-Alive (Prevent Auto-Pause)

on:
  schedule:
    # Runs every 6 hours (UTC) to keep Supabase active and reset the 7-day inactivity pause timer
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    name: Ping Supabase Edge & Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST Gateway
        run: |
          echo "=== Pinging Supabase REST Gateway ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://awaknzhadjglbfkhigck.supabase.co/rest/v1/" || true)
          echo "Supabase REST Gateway Response: $HTTP_CODE"
          if [ "$HTTP_CODE" != "000" ]; then
            echo "Supabase REST gateway active and recorded."
          fi

      - name: Ping Supabase Auth Health
        run: |
          echo "=== Pinging Supabase Auth Gateway ==="
          AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://awaknzhadjglbfkhigck.supabase.co/auth/v1/health" || true)
          echo "Supabase Auth Gateway Response: $AUTH_CODE"
          if [ "$AUTH_CODE" != "000" ]; then
            echo "Supabase Auth gateway active and recorded."
          fi

      - name: Verify Inactivity Reset
        run: |
          echo "Supabase Edge traffic activity successfully sent. 7-day inactivity timer reset!"

  render-health:
    name: Render Services Health (fail loud when instances vanish)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe backend and AI health endpoints
        run: |
          set -euo pipefail
          # A healthy Render service answers its health path; when the account
          # runs out of free instance-hours or a deploy leaves zero instances,
          # Render's proxy answers `x-render-routing: no-server` with a plain
          # 404. That state must be loud: this workflow failing emails the
          # repo owner instead of the outage being discovered by visitors.
          # Hostnames carry Render's random suffixes; the suffix-less names
          # belong to deleted services and answer `no-server` forever.
          declare -A targets=(
            ["backend"]="https://healthcare-beta-backend-4wb7.onrender.com/actuator/health"
            ["ai"]="https://healthcare-beta-ai-9mip.onrender.com/livez"
          )
          failed=0
          for name in backend ai; do
            url="${targets[$name]}"
            headers=$(curl -sI --max-time 45 "$url" || true)
            code=$(printf '%s' "$headers" | head -1 | awk '{print $2}')
            routing=$(printf '%s' "$headers" | grep -i '^x-render-routing:' | tr -d '\r' | awk '{print $2}')
            echo "$name: http=$code x-render-routing=${routing:-absent}"
            if [ "$code" != "200" ] || [ "${routing:-}" = "no-server" ]; then
              echo "::error::Render service '$name' is DOWN (http=$code, routing=${routing:-absent}). Check the Render dashboard: instance hours exhausted, failed deploy, or suspended service."
              failed=1
            fi
          done
          exit $failed
