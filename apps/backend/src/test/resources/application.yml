spring:
  datasource:
    url: jdbc:h2:mem:healthcare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-for-hmac-sha256-algorithm-required
    access-token-ttl: 900
    refresh-token-ttl: 604800
  cors:
    allowed-origins: http://localhost:3000
