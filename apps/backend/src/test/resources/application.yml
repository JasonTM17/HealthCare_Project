# Test profile — datasource is overridden at runtime by Testcontainers DynamicPropertySource.
# Only application-level test overrides are set here.
spring:
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema; Hibernate validates every mapping
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# JWT secret injected by DynamicPropertySource in AbstractIntegrationTest.
# Fallback is a safe test-only placeholder; never used in production.
app:
  jwt:
    access-token-ttl: 900
    refresh-token-ttl: 604800
  booking:
    allow-test-otp: true
  cors:
    allowed-origins: "http://localhost:3000"
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5434/healthcare}
    username: ${TEST_DB_USERNAME:healthcare}
    password: ${TEST_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver

ai:
  service:
    runtime: local
    allow-unauthenticated-local: true
