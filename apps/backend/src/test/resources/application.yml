# Test datasource is supplied at runtime by AbstractIntegrationTest. By default
# it is a disposable PostgreSQL Testcontainer; TEST_DB_URL is an explicit
# external-database escape hatch for dedicated test databases only. External
# URLs also require TEST_DB_ALLOW_CLEANUP=true because the base cleans rows.
spring:
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema; Hibernate validates every mapping
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# JWT secret injected by DynamicPropertySource in AbstractIntegrationTest.
# Fallback is a safe test-only placeholder; never used in production.
app:
  jwt:
    access-token-ttl: 900
    refresh-token-ttl: 604800
  booking:
    allow-test-otp: true
  payment:
    bank-transfer:
      enabled: true
      bank-name: "Test Bank"
      bank-bin: "970436"
      account-number: "0000000000"
      account-holder: "HEALTHCARE TEST"
      default-amount: 200000
  cors:
    allowed-origins: ""
ai:
  chat:
    # Integration tests prove the fail-closed rollback posture. A dedicated
    # local Compose profile explicitly enables these modes after approvals.
    remote-provider-enabled: false
    symptom-triage-enabled: false
    health-education-enabled: false
  service:
    runtime: local
    allow-unauthenticated-local: true
