spring:
  application:
    name: healthcare-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthcare}
    username: ${DATABASE_USERNAME:healthcare}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      # Render Key Value exposes a private redis:// connectionString. Local
      # development may continue using host/port when REDIS_URL is absent.
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:5000}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:900}
    refresh-token-ttl: ${JWT_REFRESH_TTL:604800}
  cors:
    # Browser traffic uses the same-origin Next.js BFF. Direct Spring CORS is
    # disabled unless an operator explicitly enables a separate API origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  booking:
    # The fixed demo OTP is additionally gated by the Spring test profile in
    # code; normal runtimes generate a random code and keep this false.
    allow-test-otp: ${APP_BOOKING_ALLOW_TEST_OTP:false}
  payment:
    bank-transfer:
      enabled: ${APP_PAYMENT_BANK_TRANSFER_ENABLED:false}
      bank-name: ${PAYMENT_BANK_NAME:}
      bank-bin: ${PAYMENT_BANK_BIN:}
      account-number: ${PAYMENT_BANK_ACCOUNT:}
      account-holder: ${PAYMENT_BANK_ACCOUNT_HOLDER:}
      default-amount: ${PAYMENT_DEFAULT_AMOUNT:200000}
      webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
      webhook-tolerance-seconds: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:300}
      status-email-enabled: ${PAYMENT_STATUS_EMAIL_ENABLED:true}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@healthcare.local}
    portal-base-url: ${APP_MAIL_PORTAL_BASE_URL:}
    outbox:
      enabled: ${APP_MAIL_OUTBOX_ENABLED:false}
      poll-ms: ${APP_MAIL_OUTBOX_POLL_MS:5000}
      retention-days: ${APP_MAIL_OUTBOX_RETENTION_DAYS:90}
      cleanup-ms: ${APP_MAIL_OUTBOX_CLEANUP_MS:3600000}
      cleanup-initial-delay-ms: ${APP_MAIL_OUTBOX_CLEANUP_INITIAL_DELAY_MS:3600000}
      # Base64-encoded 16/24/32-byte AES key. Required when the outbox is on;
      # never commit the value or expose it to the browser.
      encryption-key: ${APP_MAIL_OUTBOX_ENCRYPTION_KEY:}
  security:
    bff:
      # Shared only between the Next.js server and Spring. Leave blank for
      # direct local API-client testing; hosted beta must inject a secret.
      service-token: ${BACKEND_BFF_SERVICE_TOKEN:}
      required: ${BACKEND_BFF_REQUIRED:false}
      allowed-origins: ${BFF_ALLOWED_ORIGINS:http://localhost:3000}
    rate-limit:
      enabled: ${APP_SECURITY_RATE_LIMIT_ENABLED:true}
      window-seconds: ${APP_SECURITY_RATE_LIMIT_WINDOW_SECONDS:60}
      auth-limit: ${APP_SECURITY_RATE_LIMIT_AUTH_LIMIT:20}
      appointment-limit: ${APP_SECURITY_RATE_LIMIT_APPOINTMENT_LIMIT:60}
      payment-limit: ${APP_SECURITY_RATE_LIMIT_PAYMENT_LIMIT:20}
      webhook-limit: ${APP_SECURITY_RATE_LIMIT_WEBHOOK_LIMIT:120}
      ai-limit: ${APP_SECURITY_RATE_LIMIT_AI_LIMIT:30}
    auth-otp:
      enabled: ${APP_AUTH_OTP_ENABLED:true}
      ttl-seconds: ${APP_AUTH_OTP_TTL_SECONDS:600}
      resend-cooldown-seconds: ${APP_AUTH_OTP_RESEND_COOLDOWN_SECONDS:60}
      window-seconds: ${APP_AUTH_OTP_WINDOW_SECONDS:900}
      ip-limit: ${APP_AUTH_OTP_IP_LIMIT:20}
      email-limit: ${APP_AUTH_OTP_EMAIL_LIMIT:5}

cms:
  realtime:
    distributed-enabled: ${CMS_DISTRIBUTED_REALTIME_ENABLED:false}
    channel: ${CMS_REALTIME_CHANNEL:healthcare:cms:changes}
    instance-id: ${CMS_INSTANCE_ID:${HOSTNAME:local}}

patient:
  consultation:
    cleanup-enabled: ${PATIENT_CONSULTATION_CLEANUP_ENABLED:true}
    cleanup-cron: ${PATIENT_CONSULTATION_CLEANUP_CRON:0 35 3 * * *}
    cleanup-batch-size: ${PATIENT_CONSULTATION_CLEANUP_BATCH_SIZE:100}
    cleanup-max-batches: ${PATIENT_CONSULTATION_CLEANUP_MAX_BATCHES:20}

# S3-compatible storage works for MinIO, R2 and other private object stores.
# Local development keeps the historical MinIO fallback; a beta deployment
# sets storage.require-private-endpoint=true and therefore cannot fall back to
# localhost or placeholder credentials.
storage:
  endpoint: ${STORAGE_ENDPOINT:${minio.endpoint:${MINIO_ENDPOINT:http://localhost:9000}}}
  # Optional browser-reachable origin for signed URLs. Never rewrite a signed
  # URL afterward; S3 signatures include Host. Requires an explicit region.
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
  access-key: ${STORAGE_ACCESS_KEY:${minio.access-key:${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:healthcare}}}}
  secret-key: ${STORAGE_SECRET_KEY:${minio.secret-key:${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:change-me}}}}
  bucket: ${STORAGE_BUCKET:${minio.bucket:healthcare-files}}
  region: ${STORAGE_REGION:}
  require-private-endpoint: ${STORAGE_REQUIRE_PRIVATE_ENDPOINT:false}
  upload-enabled: ${STORAGE_UPLOAD_ENABLED:true}
  max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
  consultation:
    # Consultation attachments stay off unless a private bucket, durable key
    # signing secret and AV/MIME worker are explicitly provisioned.
    enabled: ${STORAGE_CONSULTATION_ENABLED:${STORAGE_UPLOAD_ENABLED:false}}
    put-url-ttl-seconds: ${STORAGE_CONSULTATION_PUT_URL_TTL_SECONDS:300}
    get-url-ttl-seconds: ${STORAGE_CONSULTATION_GET_URL_TTL_SECONDS:300}
    scan-lease-seconds: ${STORAGE_CONSULTATION_SCAN_LEASE_SECONDS:120}
    worker-enabled: ${STORAGE_CONSULTATION_SCAN_WORKER_ENABLED:false}
    scan-poll-ms: ${STORAGE_CONSULTATION_SCAN_POLL_MS:2000}
    key-signing-secret: ${STORAGE_CONSULTATION_KEY_SIGNING_SECRET:}
  av:
    required: ${STORAGE_AV_REQUIRED:false}
    service-url: ${STORAGE_AV_SERVICE_URL:}
    service-token: ${STORAGE_AV_SERVICE_TOKEN:}
    mime-validation-required: ${STORAGE_MIME_VALIDATION_REQUIRED:true}

ai:
  chat:
    retention-days: ${AI_CHAT_RETENTION_DAYS:90}
    cleanup-enabled: ${AI_CHAT_CLEANUP_ENABLED:true}
    cleanup-cron: ${AI_CHAT_CLEANUP_CRON:0 20 3 * * *}
    cleanup-batch-size: ${AI_CHAT_CLEANUP_BATCH_SIZE:200}
    cleanup-max-batches: ${AI_CHAT_CLEANUP_MAX_BATCHES:20}
    processing-lease-seconds: ${AI_CHAT_PROCESSING_LEASE_SECONDS:120}
    # Clinical modes stay off unless the deployment has completed synthetic
    # approval/reconciliation. These are also rollback safety switches.
    # Remote providers (including DeepSeek) require a separate, reviewed opt-in.
    remote-provider-enabled: ${AI_CHAT_REMOTE_PROVIDER_ENABLED:false}
    # Internal deployment opt-in only. AiConversationService additionally
    # requires the database-owned synthetic_beta_guard and fixture markers;
    # browsers cannot set this value through the public request body.
    synthetic-beta-asserted: ${AI_CHAT_SYNTHETIC_BETA_ASSERTED:false}
    symptom-triage-enabled: ${AI_CHAT_SYMPTOM_TRIAGE_ENABLED:false}
    health-education-enabled: ${AI_CHAT_HEALTH_EDUCATION_ENABLED:false}
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    token: ${AI_SERVICE_TOKEN:}
    runtime: ${AI_SERVICE_RUNTIME:non-local}
    allow-unauthenticated-local: ${AI_SERVICE_ALLOW_UNAUTHENTICATED_LOCAL:false}

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
