spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/healthcare}
    username: ${DATABASE_USERNAME:healthcare}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-must-be-replaced-before-production}
    access-token-ttl: ${JWT_ACCESS_TTL:900}
    refresh-token-ttl: ${JWT_REFRESH_TTL:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:no-reply@healthcare.local}
    outbox:
      enabled: ${APP_MAIL_OUTBOX_ENABLED:false}
      encryption-key: ${APP_MAIL_OUTBOX_ENCRYPTION_KEY:}
      poll-ms: ${APP_MAIL_OUTBOX_POLL_MS:5000}

app.public:
  specialty-triage:
    enabled: true

ai:
  service:
    runtime: ${AI_SERVICE_RUNTIME:local}
    allow-unauthenticated-local: ${AI_SERVICE_ALLOW_UNAUTHENTICATED_LOCAL:false}
