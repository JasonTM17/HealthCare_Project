spring:
  datasource:
    # File-backed H2 keeps local demo data between restarts. PostgreSQL mode plus
    # the JSONB compatibility domain lets Hibernate use the production entity
    # mappings without changing them or weakening the normal PostgreSQL profile.
    url: ${STANDALONE_DATABASE_URL:jdbc:h2:file:./data/healthcare-standalone;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS jsonb AS JSON}
    username: ${STANDALONE_DATABASE_USERNAME:sa}
    password: ${STANDALONE_DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Production migrations intentionally remain PostgreSQL-only. Hibernate owns
    # only this disposable/local schema; the default and local profiles still run
    # and validate the real Flyway history.
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:standalone-only-local-jwt-secret-change-before-sharing-2026}
    access-token-ttl: ${JWT_ACCESS_TTL:900}
    refresh-token-ttl: ${JWT_REFRESH_TTL:604800}
  cors:
    # Standalone browser traffic also goes through the same-origin Next BFF.
    # Direct Spring CORS is opt-in for a separate API origin only.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  booking:
    # Fixed OTPs are gated by the test profile in code and are never enabled by
    # this standalone profile.
    allow-test-otp: false
  mail:
    enabled: false
    outbox:
      enabled: false
      encryption-key: ${APP_MAIL_OUTBOX_ENCRYPTION_KEY:}
      poll-ms: ${APP_MAIL_OUTBOX_POLL_MS:5000}

ai:
  service:
    runtime: local
    allow-unauthenticated-local: false

# Redis only fans CMS changes out between multiple production instances. The
# single-process standalone profile keeps the in-memory feed and must remain
# healthy when Redis is not installed on a developer machine.
management:
  health:
    redis:
      enabled: false

server:
  port: ${BACKEND_PORT:8080}
